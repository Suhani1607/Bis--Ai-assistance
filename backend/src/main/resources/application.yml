spring:
  application:
    name: bis-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bis_assistant}
    username: ${DB_USER:bisuser}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns DDL
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true

# ── JWT ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600        # 1 hour (seconds)
  refresh-token-expiry: 2592000    # 30 days (seconds)

# ── RAG Service (Python FastAPI) ─────────────────────────────
rag:
  service-url: ${RAG_SERVICE_URL:http://localhost:8000}
  timeout-seconds: 60
  max-results: 8

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.bis.assistant: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    com.bis.assistant: DEBUG
