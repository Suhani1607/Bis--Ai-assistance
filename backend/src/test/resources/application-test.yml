spring:
  config:
    activate:
      on-profile: test

  datasource:
    # Testcontainers handles the real URL via @DynamicPropertySource
    url: jdbc:postgresql://localhost:5432/bis_test
    username: testuser
    password: testpass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256-signing
  access-token-expiry: 3600
  refresh-token-expiry: 86400

rag:
  service-url: http://localhost:8000   # mocked in tests via @MockBean
  timeout-seconds: 10

logging:
  level:
    com.bis.assistant: DEBUG
    org.hibernate.SQL: WARN
